services:
  styringar:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-8098}:8080"
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-ctrl.example.com}
      PUBLIC_SCHEME: https
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ALLOWED_TARGETS: ${ALLOWED_TARGETS:-}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      TILE_PARENT_DOMAIN: ${TILE_PARENT_DOMAIN:-}
    volumes:
      - styringar-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
volumes:
  styringar-data:
